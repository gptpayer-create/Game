<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>barrel.io</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#cdcdcd;
  --ui:rgba(18,22,28,.66);
  --ui-line:rgba(255,255,255,.14);
  --ink:#ffffff;
  --ink-dim:rgba(255,255,255,.72);
  --c0:#00b2e1; --c1:#f14e54; --c2:#00e16e; --c3:#bf7ff5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#2a2e35; }
}
:root[data-theme="dark"]{ --page:#2a2e35; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; overflow:hidden; background:var(--page); overscroll-behavior:none; }
body{ font-family:'Ubuntu',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
#c{ position:fixed; top:0; left:0; width:100%; height:100%; display:block; touch-action:none; background:var(--page); }

.panel{ position:fixed; background:var(--ui); border:1px solid var(--ui-line); border-radius:10px; padding:8px 10px; font-size:12px; font-weight:500; backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); pointer-events:none; }
.hud-off{ display:none !important; }

#teams{ left:calc(env(safe-area-inset-left,0px) + 8px); top:calc(env(safe-area-inset-top,0px) + 8px); width:138px; }
.trow{ position:relative; display:grid; grid-template-columns:10px 1fr auto; gap:6px; align-items:center; padding:3px 4px 5px; border-radius:6px; }
.trow b{ width:10px; height:10px; border-radius:50%; }
.trow em{ font-style:normal; font-weight:700; font-variant-numeric:tabular-nums; }
.trow i{ position:absolute; left:4px; bottom:1px; height:2px; border-radius:2px; opacity:.85; }
.trow.me{ background:rgba(255,255,255,.14); }

#feed{ position:fixed; left:calc(env(safe-area-inset-left,0px) + 8px); top:calc(env(safe-area-inset-top,0px) + 132px); display:flex; flex-direction:column; gap:4px; pointer-events:none; max-width:56vw; }
.fi{ background:var(--ui); border:1px solid var(--ui-line); border-radius:8px; padding:4px 8px; font-size:12px; font-weight:500; animation:fin .18s ease-out; }
.fi b{ font-weight:700; }
@keyframes fin{ from{ transform:translateX(-10px); opacity:0; } to{ transform:none; opacity:1; } }

.col{ position:fixed; right:calc(env(safe-area-inset-right,0px) + 8px); top:calc(env(safe-area-inset-top,0px) + 8px); display:flex; flex-direction:column; align-items:flex-end; gap:6px; pointer-events:none; }
#lb{ position:static; width:146px; }
.lrow{ display:flex; gap:6px; justify-content:space-between; padding:2px 0; }
.lrow span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lrow em{ font-style:normal; font-weight:700; font-variant-numeric:tabular-nums; }
.lrow.me{ font-weight:700; }
.lsep{ height:1px; background:var(--ui-line); margin:3px 0; }
#mini{ position:static; width:96px; height:96px; padding:0; }

#status{ left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 12px); width:min(250px,58vw); text-align:center; }
#lvlText{ font-size:13px; font-weight:700; margin-bottom:5px; }
.bar{ height:8px; border-radius:6px; background:rgba(255,255,255,.18); overflow:hidden; }
.bar i{ display:block; height:100%; width:0; background:#ffe869; border-radius:6px; transition:width .12s linear; }
#scoreText{ margin-top:5px; font-size:12px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

#toast{ position:fixed; left:50%; top:24%; transform:translate(-50%,0); background:var(--ui); border:1px solid var(--ui-line); border-radius:10px; padding:8px 14px; font-weight:700; font-size:14px; text-align:center; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:80vw; }
#toast.on{ opacity:1; transform:translate(-50%,-6px); }

#fsBtn{ position:fixed; right:calc(env(safe-area-inset-right,0px) + 8px); bottom:calc(env(safe-area-inset-bottom,0px) + 8px); width:38px; height:38px; border:1px solid var(--ui-line); border-radius:9px; background:var(--ui); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; z-index:20; }
#fsBtn:hover{ filter:brightness(1.2); }
#fsBtn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
#fsBtn svg{ width:18px; height:18px; display:block; }

.stick{ position:fixed; left:0; top:0; width:110px; height:110px; margin:0; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:rgba(0,0,0,.14); pointer-events:none; opacity:0; }
.stick.ghost{ opacity:.35; }
.stick.on{ opacity:.75; }
.stick i{ position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.8); }

.overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,12,16,.42); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.overlay.gone{ display:none; }
.card{ width:min(360px,100%); background:rgba(18,22,28,.86); border:1px solid var(--ui-line); border-radius:16px; padding:22px 20px 18px; text-align:center; }
.card h1{ margin:0; font-size:44px; line-height:1; font-weight:700; letter-spacing:-.02em; }
.card p{ margin:8px 0 0; color:var(--ink-dim); font-size:14px; line-height:1.45; }
#nameIn{ margin-top:16px; width:100%; height:44px; border-radius:10px; border:1px solid var(--ui-line); background:rgba(255,255,255,.08); color:#fff; font:500 16px 'Ubuntu',system-ui,sans-serif; text-align:center; outline:none; user-select:text; -webkit-user-select:text; }
#nameIn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
#serverList{ display:flex; flex-direction:column; gap:6px; margin-top:14px; text-align:left; }
#serverList .srvLbl{ font-size:11px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
.srvBtn{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; border:1px solid var(--ui-line); background:rgba(255,255,255,.06); color:#fff; font:500 13px 'Ubuntu',system-ui,sans-serif; cursor:pointer; width:100%; }
.srvBtn.on{ border-color:#00b2e1; background:rgba(0,178,225,.18); }
.srvBtn:disabled{ opacity:.4; cursor:default; }
.srvBtn .ping{ font-size:11px; color:var(--ink-dim); font-variant-numeric:tabular-nums; flex-shrink:0; }
.srvBtn .ping.up{ color:#7fe3a0; }
.srvBtn .ping.down{ color:#f14e54; }
.chips{ display:flex; justify-content:center; gap:12px; margin:16px 0 6px; }
.chip{ width:46px; height:46px; border-radius:50%; border:3px solid rgba(255,255,255,.18); opacity:.5; transition:transform .1s, opacity .1s, border-color .1s; }
.chip.on{ transform:scale(1.18); opacity:1; border-color:#fff; }
#teamLbl{ min-height:20px; font-weight:700; font-size:15px; }
#playBtn{ margin-top:12px; width:100%; height:48px; border:0; border-radius:12px; background:#00b2e1; color:#04222c; font:700 17px 'Ubuntu',system-ui,sans-serif; cursor:pointer; }
#playBtn:hover{ filter:brightness(1.08); }
#playBtn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
#playBtn:disabled{ opacity:.6; cursor:default; }
.how{ margin-top:14px; font-size:12px; color:var(--ink-dim); line-height:1.5; text-align:left; }
.how b{ color:#fff; }
.stats{ display:flex; justify-content:center; gap:18px; margin-top:12px; font-size:13px; color:var(--ink-dim); }
.stats b{ display:block; font-size:22px; color:#fff; font-variant-numeric:tabular-nums; }
@media (max-width:420px){
  .panel{ font-size:11px; padding:6px 8px; }
  #teams{ width:118px; }
  #lb{ width:126px; }
  #mini{ width:84px; height:84px; }
  #feed{ top:calc(env(safe-area-inset-top,0px) + 116px); }
}
@media (prefers-reduced-motion: reduce){
  .fi{ animation:none; }
  #toast,.chip,.bar i{ transition:none; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="fsBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
  <svg id="fsIconOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  <svg id="fsIconClose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9 3v4a2 2 0 0 1-2 2H3"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/><path d="M9 21v-4a2 2 0 0 0-2-2H3"/><path d="M15 21v-4a2 2 0 0 1 2-2h4"/></svg>
</button>

<div id="hud" class="hud-off">
  <div class="panel" id="teams"></div>
  <div id="feed"></div>
  <div class="col">
    <div class="panel" id="lb"></div>
    <canvas class="panel" id="mini" width="200" height="200"></canvas>
  </div>
  <div class="panel" id="status">
    <div id="lvlText">Lv 1 Basic</div>
    <div class="bar"><i id="lvlBar"></i></div>
    <div id="scoreText">Score 0</div>
  </div>
  <div id="toast"></div>
</div>

<div class="stick" id="stickL"><i></i></div>
<div class="stick" id="stickR"><i></i></div>

<div class="overlay" id="menu">
  <div class="card">
    <h1 id="mTitle">barrel.io</h1>
    <p id="mSub">4 teams, 20 bots per team. You'll get a random team.</p>
    <div class="stats gone" id="mStats" style="display:none"></div>
    <input id="nameIn" maxlength="14" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <div id="serverList">
      <div class="srvLbl">Server</div>
    </div>
    <div class="chips" id="chips" aria-hidden="true">
      <div class="chip" style="background:var(--c0)"></div>
      <div class="chip" style="background:var(--c1)"></div>
      <div class="chip" style="background:var(--c2)"></div>
      <div class="chip" style="background:var(--c3)"></div>
    </div>
    <div id="teamLbl">&nbsp;</div>
    <button id="playBtn">Get a team & play</button>
    <div class="how">
      <b>Points:</b> break blocks to earn points. Kill another player to take 25% of their points.<br>
      <b>PC:</b> WASD to move, mouse to aim, click to fire (E = auto-fire).<br>
      <b>Phone:</b> left stick to move, right stick to aim + fire.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/colyseus.js@^0.15.0/dist/colyseus.js"></script>
<script>
(() => {
'use strict';

/* ---------- constants ----------
 * These mirror constants.js / schema.js on the server exactly (map size,
 * team layout, tiers, block stats). They're used for rendering only now —
 * the server is the sole source of truth for simulation. */
const TAU = Math.PI * 2;
const W = 4000, H = 4000, BASE = 700, GRID = 60;
const CELL = 250, GN = Math.ceil(W / CELL); // kept only because drawMini/draw don't need it, harmless

const TEAMS = [
  { name: 'Blue',   color: '#00b2e1', dark: '#0083a8', cx: 400,     cy: 400 },
  { name: 'Red',    color: '#f14e54', dark: '#b93a3f', cx: W - 400, cy: 400 },
  { name: 'Green',  color: '#00e16e', dark: '#00a852', cx: 400,     cy: H - 400 },
  { name: 'Purple', color: '#bf7ff5', dark: '#8f5fb8', cx: W - 400, cy: H - 400 }
];
const BASE_RECTS = TEAMS.map(T => ({
  x0: T.cx < W / 2 ? 0 : W - BASE, y0: T.cy < H / 2 ? 0 : H - BASE,
  x1: (T.cx < W / 2 ? 0 : W - BASE) + BASE, y1: (T.cy < H / 2 ? 0 : H - BASE) + BASE
}));

const TIERS = [
  { name: 'Basic',  lvl: 1,  barrels: [{ a: 0, off: 0, len: 1.75, w: .62 }] },
  { name: 'Twin',   lvl: 6,  barrels: [{ a: 0, off: -.45, len: 1.7, w: .44 }, { a: 0, off: .45, len: 1.7, w: .44 }] },
  { name: 'Triple', lvl: 12, barrels: [{ a: -.45, off: 0, len: 1.6, w: .5 }, { a: .45, off: 0, len: 1.6, w: .5 }, { a: 0, off: 0, len: 1.9, w: .5 }] },
  { name: 'Quad',   lvl: 20, barrels: [0, 1, 2, 3].map(k => ({ a: k * Math.PI / 2, off: 0, len: 1.6, w: .55 })) }
];

const BT = {
  sq:   { sides: 4, r: 19, fill: '#ffe869', stroke: '#bfae4e' },
  tri:  { sides: 3, r: 22, fill: '#fc7677', stroke: '#bd5556' },
  pent: { sides: 5, r: 34, fill: '#768dfc', stroke: '#5566bd' }
};

const THEME = {
  light: { bg: '#cdcdcd', grid: '#c2c2c2', out: '#b3b3b3' },
  dark:  { bg: '#2a2e35', grid: '#31363e', out: '#1c1f24' }
};

// Fills in the derived visual fields the server doesn't sync (r, speed) from
// a tank's synced `level` — same pure formulas as constants.js/TDMRoom.js,
// so every client computes the identical radius/speed the server used.
function computeR(level) { return 17 + Math.min(level, 30) * .55; }
function computeSpeed(level) { return Math.max(165, 255 - level * 2.2); }
function levelFor(s) { return Math.min(40, 1 + Math.floor(Math.sqrt(s / 12))); }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }

/* ---------- canvas ---------- */
const canvas = $('c'), ctx = canvas.getContext('2d');
const mini = $('mini'), mctx = mini.getContext('2d');
let vw = 0, vh = 0, dpr = 1, baseZoom = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  baseZoom = clamp(Math.min(vw, vh) / 700, .45, 1);
}
window.addEventListener('resize', resize);
resize();

/* ---------- local (non-authoritative) state ----------
 * Everything about the game world itself — tank/bullet/block positions,
 * HP, scores, AI — now lives on the server. `remoteTanks`/`remoteBullets`/
 * `remoteBlocks` hold direct references to the live Colyseus schema
 * instances: Colyseus mutates their fields in place as patches arrive, so
 * reading e.g. `t.x` here always returns the latest known value — no local
 * copying or onChange plumbing needed. Only cosmetic, client-only state
 * (particles, floaters, camera, our own predicted position) lives here. */
let time = 0, state = 'menu';       // menu | connecting | playing | dead
let isDark = false, themeT = 0;
const particles = [], floaters = [];
let camX = W / 2, camY = H / 2, zoom = baseZoom;
let hudT = 0, best = 0;

/* ---------- networking ---------- */
const SERVERS = [
  { id: 'local', label: 'Local (dev)', ws: 'ws://localhost:2567' },
  { id: 'na', label: 'North America', ws: 'wss://barrel-na.fly.dev' },
  { id: 'eu', label: 'Europe', ws: 'wss://barrel-eu.fly.dev' },
  { id: 'in', label: 'India', ws: 'wss://barrel-in.fly.dev' },
];
let selectedServer = safeGet('barrel-server') || SERVERS[0].id;

let room = null, myId = null;
const remoteTanks = new Map();   // sessionId -> live TankSchema instance
const remoteBullets = new Map(); // id -> live BulletSchema instance
const remoteBlocks = new Map();  // id -> live BlockSchema instance
const blockLastHp = new Map();   // id -> hp last frame, to derive a local "just hit" flash (not synced)
let specId = null;               // spectate target when dead / before playing
let lastScoreSeen = 0;

function statusUrl(wsUrl) {
  return wsUrl.replace(/^ws:/, 'http:').replace(/^wss:/, 'https:') + '/status';
}

async function pingServer(srv, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const t0 = performance.now();
    const res = await fetch(statusUrl(srv.ws), { signal: ctrl.signal, mode: 'cors' });
    const ms = Math.round(performance.now() - t0);
    clearTimeout(timer);
    if (!res.ok) return { up: false };
    const data = await res.json();
    return { up: true, ms, players: data && typeof data.players === 'number' ? data.players : null };
  } catch (e) {
    clearTimeout(timer);
    return { up: false };
  }
}

function renderServerList() {
  const box = $('serverList');
  box.innerHTML = '<div class="srvLbl">Server</div>';
  for (const srv of SERVERS) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'srvBtn' + (srv.id === selectedServer ? ' on' : '');
    btn.dataset.id = srv.id;
    btn.innerHTML = '<span>' + esc(srv.label) + '</span><span class="ping" id="ping-' + srv.id + '">…</span>';
    btn.addEventListener('click', () => {
      selectedServer = srv.id; safeSet('barrel-server', srv.id);
      [...box.querySelectorAll('.srvBtn')].forEach(b => b.classList.toggle('on', b.dataset.id === srv.id));
    });
    box.appendChild(btn);
  }
  for (const srv of SERVERS) {
    pingServer(srv, 2500).then(r => {
      const el = $('ping-' + srv.id);
      if (!el) return;
      if (r.up) { el.textContent = (r.players != null ? r.players + ' online' : 'online') + (r.ms != null ? ' · ' + r.ms + 'ms' : ''); el.className = 'ping up'; }
      else { el.textContent = 'offline'; el.className = 'ping down'; }
    });
  }
}

function wireRoom(r) {
  r.state.tanks.onAdd((t, id) => remoteTanks.set(id, t));
  r.state.tanks.onRemove((t, id) => remoteTanks.delete(id));
  r.state.bullets.onAdd((b, id) => remoteBullets.set(id, b));
  r.state.bullets.onRemove((b, id) => {
    // Server doesn't send a separate "bullet hit X" event, so we approximate
    // an impact spark at the bullet's last known spot whenever it despawns
    // (covers hits and, a little inaccurately, natural expiry too).
    spark(b.x, b.y, TEAMS[b.team] ? TEAMS[b.team].color : '#fff');
    remoteBullets.delete(id);
  });
  r.state.blocks.onAdd((k, id) => { remoteBlocks.set(id, k); blockLastHp.set(id, k.hp); });
  r.state.blocks.onRemove((k, id) => {
    const B = BT[k.type] || BT.sq;
    burst(k.x, k.y, B.fill, 8, 160);
    remoteBlocks.delete(id); blockLastHp.delete(id);
  });
  r.onMessage('kill', data => {
    addFeed(data);
    if (data.victimId === myId) onPlayerDeath(data);
  });
  r.onLeave(() => onDisconnected('Lost connection to the server'));
  r.onError((code, message) => onDisconnected(message || ('Connection error (' + code + ')')));
}

function connect(url, name) {
  const client = new Colyseus.Client(url);
  return client.joinOrCreate('tdm', { name });
}

function waitForOwnTank() {
  return new Promise(resolve => {
    const existing = remoteTanks.get(myId);
    if (existing) { resolve(existing); return; }
    let tries = 0;
    const iv = setInterval(() => {
      const t = remoteTanks.get(myId);
      tries++;
      if (t) { clearInterval(iv); resolve(t); }
      else if (tries > 100) { clearInterval(iv); resolve(null); } // ~5s
    }, 50);
  });
}

function resetNetState() {
  room = null; myId = null;
  remoteTanks.clear(); remoteBullets.clear(); remoteBlocks.clear(); blockLastHp.clear();
  specId = null;
}

function onDisconnected(message) {
  if (state === 'menu') return;
  state = 'menu';
  $('hud').classList.add('hud-off');
  menu.classList.remove('gone');
  $('mTitle').textContent = 'Disconnected';
  $('mSub').textContent = (message || 'Lost connection to the server') + '. Pick a server and try again.';
  $('mStats').style.display = 'none';
  playBtn.textContent = 'Get a team & play'; playBtn.disabled = false;
  teamLbl.innerHTML = '&nbsp;'; chips.forEach(c => c.classList.remove('on'));
  resetNetState();
}

/* ---------- combat feedback (client-only cosmetics) ---------- */
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n && particles.length < 350; i++) {
    const a = rand(0, TAU), s = rand(spd * .3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.3, .6), max: .6, color, size: rand(3, 7) });
  }
}
function spark(x, y, color) {
  for (let i = 0; i < 4 && particles.length < 350; i++) {
    const a = rand(0, TAU), s = rand(40, 130);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .18, max: .18, color, size: rand(2, 4) });
  }
}
function addFeed(data) {
  const feed = $('feed');
  const d = document.createElement('div'); d.className = 'fi';
  if (data.killer) {
    const a = document.createElement('b'); a.textContent = data.killer; a.style.color = TEAMS[data.killerTeam].color;
    const m = document.createTextNode(' killed ');
    const v = document.createElement('b'); v.textContent = data.victim; v.style.color = TEAMS[data.victimTeam].color;
    d.append(a, m, v);
    if (data.gain > 0) { const g = document.createElement('span'); g.textContent = '  +' + data.gain; g.style.fontWeight = '700'; d.append(g); }
  } else {
    const v = document.createElement('b'); v.textContent = data.victim; v.style.color = TEAMS[data.victimTeam].color;
    d.append(v, document.createTextNode(' was destroyed'));
  }
  feed.append(d);
  while (feed.children.length > 6) feed.firstChild.remove();
  setTimeout(() => d.remove(), 3200);
}

/* ---------- input ---------- */
const keys = new Set();
const mouse = { x: 0, y: 0, down: false };
let autoFire = false, usingTouch = window.matchMedia('(pointer: coarse)').matches;
const sticks = { L: { id: null, sx: 0, sy: 0, x: 0, y: 0 }, R: { id: null, sx: 0, sy: 0, x: 0, y: 0 } };
const STICK_R = 55;
function stickVec(s) {
  const dx = s.x - s.sx, dy = s.y - s.sy, len = Math.hypot(dx, dy);
  return { dx, dy, len, mag: Math.min(1, len / STICK_R), ang: Math.atan2(dy, dx) };
}
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') startFlow(); return; }
  const k = e.key.toLowerCase();
  if (k === 'e' && !e.repeat) autoFire = !autoFire;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys.add(k);
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; });
canvas.addEventListener('mousemove', e => { usingTouch = false; mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); usingTouch = true;
  for (const t of e.changedTouches) {
    const k = t.clientX < vw / 2 ? 'L' : 'R', s = sticks[k];
    if (s.id !== null) continue;
    s.id = t.identifier; s.sx = s.x = t.clientX; s.sy = s.y = t.clientY;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) for (const k of ['L', 'R']) {
    const s = sticks[k]; if (s.id === t.identifier) { s.x = t.clientX; s.y = t.clientY; }
  }
}, { passive: false });
const tEnd = e => { for (const t of e.changedTouches) for (const k of ['L', 'R']) if (sticks[k].id === t.identifier) sticks[k].id = null; };
canvas.addEventListener('touchend', tEnd);
canvas.addEventListener('touchcancel', tEnd);

/* ---------- own-tank client-side prediction ----------
 * Per the README's plan: move locally the instant input happens (so it
 * feels responsive), then gently correct toward the server's authoritative
 * x/y every frame. This only predicts free movement, not collisions with
 * blocks/bases/other tanks — the server still owns those, so predicted
 * position snaps back quickly (rather than perfectly smoothly) whenever it
 * would have hit something. That's a deliberate simplification, not a bug. */
let predX = 0, predY = 0, predVX = 0, predVY = 0, predAngle = 0;
let inputAccT = 0;
const INPUT_HZ = 30; // matches the server's 30Hz sim tick

function sendInput(dt, mx, my, angle, fire) {
  inputAccT += dt;
  if (inputAccT < 1 / INPUT_HZ) return;
  inputAccT = 0;
  if (room) room.send('input', { mx, my, angle, fire });
}

function playerControl(dt) {
  const st = remoteTanks.get(myId);
  if (!st) return;
  let mx = 0, my = 0, fire = false;
  if (keys.has('w') || keys.has('arrowup')) my -= 1;
  if (keys.has('s') || keys.has('arrowdown')) my += 1;
  if (keys.has('a') || keys.has('arrowleft')) mx -= 1;
  if (keys.has('d') || keys.has('arrowright')) mx += 1;
  const L = sticks.L;
  if (L.id !== null) { const v = stickVec(L); if (v.mag > .15) { mx = Math.cos(v.ang) * v.mag; my = Math.sin(v.ang) * v.mag; } }
  const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }

  if (usingTouch) {
    const R = sticks.R;
    if (R.id !== null) { const v = stickVec(R); if (v.len > 8) predAngle = v.ang; fire = v.mag > .25; }
    else if (len > .2) predAngle = Math.atan2(my, mx);
  } else {
    predAngle = Math.atan2(mouse.y - vh / 2, mouse.x - vw / 2);
    fire = mouse.down || keys.has(' ') || autoFire;
  }

  const speed = computeSpeed(st.level);
  const k = Math.min(1, 7 * dt);
  predVX += (mx * speed - predVX) * k; predVY += (my * speed - predVY) * k;
  predX += predVX * dt; predY += predVY * dt;

  // gentle correction toward the server's version of us
  const corr = Math.min(1, 5 * dt);
  predX += (st.x - predX) * corr; predY += (st.y - predY) * corr;

  // write the reconciled prediction back into the live schema instance so
  // every draw/HUD/camera function can just read t.x/t.y/t.angle uniformly
  // for every tank, mine included, without any special-casing.
  st.x = predX; st.y = predY; st.angle = predAngle;

  sendInput(dt, mx, my, predAngle, fire);
}

/* ---------- update ---------- */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200);
}

let lastLevel = 1, lastTier = 0;
function checkLevelToast(st) {
  if (st.level === lastLevel) return;
  if (st.level > lastLevel) toast(st.tier !== lastTier ? 'Level ' + st.level + ': unlocked ' + TIERS[st.tier].name + ' barrel!' : 'Level ' + st.level);
  lastLevel = st.level; lastTier = st.tier;
}

function pickSpectateTarget() {
  let bestT = null, bestId = null;
  for (const [id, t] of remoteTanks) {
    if (t.alive && id !== myId && (!bestT || t.score > bestT.score)) { bestT = t; bestId = id; }
  }
  return bestId;
}

function update(dt) {
  time += dt;
  themeT -= dt;
  if (themeT <= 0) {
    themeT = 1;
    const th = document.documentElement.getAttribute('data-theme');
    isDark = th === 'dark' || (th !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  const myTank = myId ? remoteTanks.get(myId) : null;

  if (state === 'playing' && myTank && myTank.alive) {
    playerControl(dt);
    checkLevelToast(myTank);
    if (myTank.score > lastScoreSeen) {
      floaters.push({ x: myTank.x, y: myTank.y, text: '+' + (myTank.score - lastScoreSeen), life: 1, color: TEAMS[myTank.team].color });
    }
    lastScoreSeen = myTank.score;
  }

  // derive a local "just hit" flash for blocks (hp isn't watched by the server for this — cosmetic only)
  for (const [id, k] of remoteBlocks) {
    const prev = blockLastHp.get(id);
    if (k._flash === undefined) k._flash = 0;
    if (prev !== undefined && k.hp < prev) k._flash = .1;
    else if (k._flash > 0) k._flash -= dt;
    blockLastHp.set(id, k.hp);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .93; p.vy *= .93;
    if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); }
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.life -= dt; f.y -= 40 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  // camera: follow our tank while playing/alive, otherwise spectate the top scorer
  let target = null;
  if (state === 'playing' && myTank && myTank.alive) target = myTank;
  else {
    let spec = specId ? remoteTanks.get(specId) : null;
    if (!spec || !spec.alive) { specId = pickSpectateTarget(); spec = specId ? remoteTanks.get(specId) : null; }
    target = spec;
  }
  if (target) {
    if (target === myTank) { camX = target.x; camY = target.y; }
    else { const k = Math.min(1, 4 * dt); camX += (target.x - camX) * k; camY += (target.y - camY) * k; }
    const zt = baseZoom * (1 - Math.min(target.level, 30) * .006);
    zoom += (zt - zoom) * Math.min(1, 3 * dt);
  }

  hudT -= dt;
  if (hudT <= 0) { hudT = .2; updateHud(); }
}

/* ---------- HUD ---------- */
function updateHud() {
  const inGame = state === 'playing';
  const myTank = myId ? remoteTanks.get(myId) : null;
  const teamPts = room ? [room.state.teamPts0, room.state.teamPts1, room.state.teamPts2, room.state.teamPts3] : [0, 0, 0, 0];
  const max = Math.max(1, ...teamPts);
  let h = '';
  for (let i = 0; i < 4; i++) {
    h += '<div class="trow' + (inGame && myTank && myTank.team === i ? ' me' : '') + '"><b style="background:' + TEAMS[i].color + '"></b><span>' + TEAMS[i].name + '</span><em>' + fmt(teamPts[i]) + '</em><i style="width:calc(' + (teamPts[i] / max * 100).toFixed(1) + '% - 8px);background:' + TEAMS[i].color + '"></i></div>';
  }
  $('teams').innerHTML = h;

  const aliveEntries = [...remoteTanks.entries()].filter(([, t]) => t.alive).sort((a, b) => b[1].score - a[1].score);
  let l = '';
  const row = (id, t, rank) => '<div class="lrow' + (id === myId ? ' me' : '') + '"><span style="color:' + TEAMS[t.team].color + '">' + (rank ? '#' + rank + ' ' : '') + esc(t.name) + '</span><em>' + fmt(t.score) + '</em></div>';
  const top = aliveEntries.slice(0, 5);
  top.forEach(([id, t]) => { l += row(id, t, 0); });
  const myIdx = aliveEntries.findIndex(([id]) => id === myId);
  if (inGame && myTank && myTank.alive && myIdx >= 5) l += '<div class="lsep"></div>' + row(myId, myTank, myIdx + 1);
  $('lb').innerHTML = l;

  if (inGame && myTank && myTank.alive) {
    const Lv = myTank.level, lo = 12 * (Lv - 1) * (Lv - 1), hi = 12 * Lv * Lv;
    $('lvlText').textContent = 'Lv ' + Lv + ' ' + TIERS[myTank.tier].name;
    $('lvlBar').style.width = (Lv >= 40 ? 100 : clamp((myTank.score - lo) / (hi - lo), 0, 1) * 100) + '%';
    $('lvlBar').style.background = TEAMS[myTank.team].color;
    $('scoreText').textContent = 'Score ' + fmt(myTank.score) + '  ·  Kills ' + myTank.kills;
  }
}

/* ---------- drawing ---------- */
function poly(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function hpBar(x, y, w, ratio, color) {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - w / 2, y, w, 5);
  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y, w * clamp(ratio, 0, 1), 5);
}
function drawBlock(k) {
  const B = BT[k.type] || BT.sq;
  ctx.lineWidth = 3; ctx.lineJoin = 'round';
  poly(k.x, k.y, B.r, B.sides, k.rot);
  ctx.fillStyle = B.fill; ctx.strokeStyle = B.stroke; ctx.fill(); ctx.stroke();
  if (k._flash > 0) { ctx.globalAlpha = .4; ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1; }
  if (k.hp < k.maxHp) hpBar(k.x, k.y + B.r + 8, B.r * 1.6, k.hp / k.maxHp, '#85e37d');
}
function drawTank(t) {
  const T = TEAMS[t.team];
  ctx.save();
  ctx.translate(t.x, t.y);
  if (t.invuln > 0) ctx.globalAlpha = .55 + .25 * Math.sin(time * 20);
  ctx.rotate(t.angle);
  ctx.lineWidth = 3; ctx.lineJoin = 'round';
  for (const b of TIERS[t.tier].barrels) {
    ctx.save(); ctx.rotate(b.a);
    const len = t.r * b.len, w = t.r * b.w;
    ctx.fillStyle = '#999'; ctx.strokeStyle = '#6f6f6f';
    ctx.beginPath(); ctx.rect(0, t.r * b.off - w / 2, len, w); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.rotate(-t.angle);
  ctx.beginPath(); ctx.arc(0, 0, t.r, 0, TAU);
  ctx.fillStyle = T.color; ctx.strokeStyle = T.dark; ctx.fill(); ctx.stroke();
  if (t.flash > 0) { ctx.globalAlpha = Math.min(1, t.flash * 6); ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
}
function drawTankLabel(t) {
  const fs = Math.max(11, 13 / zoom * .75);
  ctx.font = '700 ' + fs + 'px Ubuntu, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = fs * .2; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineJoin = 'round';
  ctx.strokeText(t.name, t.x, t.y - t.r - fs * .9);
  ctx.fillStyle = '#fff'; ctx.fillText(t.name, t.x, t.y - t.r - fs * .9);
  if (t.hp < t.maxHp) hpBar(t.x, t.y + t.r + 9, t.r * 2, t.hp / t.maxHp, '#85e37d');
}

function draw() {
  const col = isDark ? THEME.dark : THEME.light;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = col.out; ctx.fillRect(0, 0, vw, vh);
  ctx.translate(vw / 2, vh / 2); ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);

  const hw = vw / 2 / zoom, hh = vh / 2 / zoom;
  const vx0 = camX - hw - 60, vx1 = camX + hw + 60, vy0 = camY - hh - 60, vy1 = camY + hh + 60;

  ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .16;
  for (const T of TEAMS) { ctx.fillStyle = T.color; ctx.fillRect(T.cx < W / 2 ? 0 : W - BASE, T.cy < H / 2 ? 0 : H - BASE, BASE, BASE); }
  ctx.globalAlpha = .8; ctx.lineWidth = 5;
  for (let bi = 0; bi < 4; bi++) {
    const r = BASE_RECTS[bi];
    ctx.strokeStyle = TEAMS[bi].color;
    ctx.strokeRect(r.x0 + 2.5, r.y0 + 2.5, BASE - 5, BASE - 5);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = col.grid; ctx.lineWidth = 1.5; ctx.beginPath();
  const gy0 = Math.max(0, vy0), gy1 = Math.min(H, vy1), gx0 = Math.max(0, vx0), gx1 = Math.min(W, vx1);
  for (let x = Math.ceil(gx0 / GRID) * GRID; x <= gx1; x += GRID) { ctx.moveTo(x, gy0); ctx.lineTo(x, gy1); }
  for (let y = Math.ceil(gy0 / GRID) * GRID; y <= gy1; y += GRID) { ctx.moveTo(gx0, y); ctx.lineTo(gx1, y); }
  ctx.stroke();

  for (const k of remoteBlocks.values()) {
    if (k.x < vx0 || k.x > vx1 || k.y < vy0 || k.y > vy1) continue;
    drawBlock(k);
  }

  ctx.lineWidth = 2.5;
  for (const b of remoteBullets.values()) {
    if (b.x < vx0 || b.x > vx1 || b.y < vy0 || b.y > vy1) continue;
    const T = TEAMS[b.team];
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fillStyle = T.color; ctx.strokeStyle = T.dark; ctx.fill(); ctx.stroke();
  }

  const vis = [];
  const myTank = myId ? remoteTanks.get(myId) : null;
  for (const [id, t] of remoteTanks) {
    if (id === myId) continue;
    if (!t.alive || t.x < vx0 - 80 || t.x > vx1 + 80 || t.y < vy0 - 80 || t.y > vy1 + 80) continue;
    t.r = computeR(t.level);
    drawTank(t); vis.push(t);
  }
  if (myTank && myTank.alive && state === 'playing') {
    myTank.r = computeR(myTank.level);
    drawTank(myTank); vis.push(myTank);
  }

  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const t of vis) drawTankLabel(t);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    const fs = 16 / zoom * .8;
    ctx.globalAlpha = clamp(f.life * 1.6, 0, 1);
    ctx.font = '700 ' + fs + 'px Ubuntu, system-ui, sans-serif';
    ctx.lineWidth = fs * .2; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = '#fff'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  drawMini(hw, hh);
  drawSticks();
}

function drawMini(hw, hh) {
  const S = mini.width, sc = S / W;
  mctx.clearRect(0, 0, S, S);
  mctx.globalAlpha = .4;
  for (const T of TEAMS) { mctx.fillStyle = T.color; mctx.fillRect((T.cx < W / 2 ? 0 : W - BASE) * sc, (T.cy < H / 2 ? 0 : H - BASE) * sc, BASE * sc, BASE * sc); }
  mctx.globalAlpha = 1;
  const myTank = myId ? remoteTanks.get(myId) : null;
  for (const [id, t] of remoteTanks) {
    if (!t.alive || id === myId) continue;
    mctx.fillStyle = TEAMS[t.team].color; mctx.beginPath(); mctx.arc(t.x * sc, t.y * sc, 2.4, 0, TAU); mctx.fill();
  }
  if (state === 'playing' && myTank && myTank.alive) {
    mctx.fillStyle = TEAMS[myTank.team].color; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
    mctx.beginPath(); mctx.arc(myTank.x * sc, myTank.y * sc, 4.5, 0, TAU); mctx.fill(); mctx.stroke();
  }
  mctx.strokeStyle = 'rgba(255,255,255,.65)'; mctx.lineWidth = 1;
  mctx.strokeRect((camX - hw) * sc, (camY - hh) * sc, hw * 2 * sc, hh * 2 * sc);
}

const stickEl = { L: $('stickL'), R: $('stickR') };
function drawSticks() {
  for (const k of ['L', 'R']) {
    const s = sticks[k], e = stickEl[k], knob = e.firstElementChild;
    if (s.id !== null) {
      const v = stickVec(s), f = v.len > STICK_R ? STICK_R / v.len : 1;
      e.style.transform = 'translate(' + (s.sx - 55) + 'px,' + (s.sy - 55) + 'px)';
      knob.style.transform = 'translate(' + (v.dx * f) + 'px,' + (v.dy * f) + 'px)';
      e.className = 'stick on';
    } else {
      const ix = k === 'L' ? 85 : vw - 85, iy = vh - 130;
      e.style.transform = 'translate(' + (ix - 55) + 'px,' + (iy - 55) + 'px)';
      knob.style.transform = 'translate(0,0)';
      e.className = 'stick' + (usingTouch && state === 'playing' ? ' ghost' : '');
    }
  }
}

/* ---------- fullscreen ---------- */
const fsBtn = $('fsBtn'), fsOpen = $('fsIconOpen'), fsClose = $('fsIconClose');
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function syncFsIcon() {
  const on = isFs();
  fsOpen.style.display = on ? 'none' : 'block';
  fsClose.style.display = on ? 'block' : 'none';
  fsBtn.title = on ? 'Exit fullscreen' : 'Fullscreen';
}
function toggleFs() {
  const el = document.documentElement;
  try {
    if (!isFs()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el).catch(() => {});
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document).catch(() => {});
    }
  } catch (e) { /* fullscreen unsupported, ignore */ }
}
fsBtn.addEventListener('click', toggleFs);
document.addEventListener('fullscreenchange', syncFsIcon);
document.addEventListener('webkitfullscreenchange', syncFsIcon);
window.addEventListener('keydown', e => { if (e.key === 'F11') e.preventDefault(); if (e.key.toLowerCase() === 'f' && !(e.target && e.target.tagName === 'INPUT')) toggleFs(); });
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) fsBtn.style.display = 'none';

/* ---------- menu flow ---------- */
const menu = $('menu'), playBtn = $('playBtn'), chips = [...document.querySelectorAll('.chip')], teamLbl = $('teamLbl'), nameIn = $('nameIn');
let rolling = false;
nameIn.value = safeGet('barrel-name') || '';
renderServerList();

function roll(targetTeam, done) {
  const steps = 12 + targetTeam;
  let i = 0;
  teamLbl.textContent = 'Picking your team...'; teamLbl.style.color = '';
  const tick = () => {
    chips.forEach((c, n) => c.classList.toggle('on', n === i % 4));
    if (i >= steps) { done(); return; }
    i++;
    setTimeout(tick, 55 + i * i * 1.5);
  };
  tick();
}

async function startFlow() {
  if (rolling || state === 'playing' || state === 'connecting') return;
  const srv = SERVERS.find(s => s.id === selectedServer) || SERVERS[0];
  const nm = nameIn.value.trim().slice(0, 14) || 'You';
  safeSet('barrel-name', nm === 'You' ? '' : nm);

  rolling = true; state = 'connecting'; playBtn.disabled = true;
  teamLbl.textContent = 'Connecting to ' + srv.label + '...'; teamLbl.style.color = '';

  let r;
  try {
    r = await connect(srv.ws, nm);
  } catch (err) {
    teamLbl.textContent = 'Could not connect. Try another server.'; teamLbl.style.color = '#f14e54';
    rolling = false; state = 'menu'; playBtn.disabled = false;
    return;
  }
  room = r; myId = r.sessionId; wireRoom(r);

  const myTank = await waitForOwnTank();
  if (!myTank) {
    teamLbl.textContent = 'Connected, but something went wrong.'; teamLbl.style.color = '#f14e54';
    rolling = false; state = 'menu'; playBtn.disabled = false;
    return;
  }

  roll(myTank.team, () => {
    teamLbl.textContent = 'You are on the ' + TEAMS[myTank.team].name + ' team';
    teamLbl.style.color = TEAMS[myTank.team].color;
    setTimeout(() => startGame(), 950);
  });
}

function startGame() {
  const myTank = remoteTanks.get(myId);
  state = 'playing'; rolling = false; playBtn.disabled = false;
  menu.classList.add('gone');
  $('hud').classList.remove('hud-off');
  camX = predX = myTank.x; camY = predY = myTank.y;
  predVX = 0; predVY = 0; predAngle = myTank.angle;
  lastScoreSeen = myTank.score; lastLevel = myTank.level; lastTier = myTank.tier;
  updateHud();
}

function onPlayerDeath(data) {
  state = 'dead';
  const myTank = remoteTanks.get(myId);
  best = Math.max(best, myTank ? myTank.score : best);
  setTimeout(() => {
    if (state !== 'dead') return;
    const who = data.killer ? data.killer + ' (' + TEAMS[data.killerTeam].name + ')' : 'Blocks';
    $('mTitle').textContent = 'You died';
    $('mSub').textContent = who + ' killed you. You\'ll get a random team again next time.';
    const st = $('mStats'); st.style.display = 'flex';
    st.innerHTML = '<div><b>' + fmt(myTank ? myTank.score : 0) + '</b>score</div><div><b>' + (myTank ? myTank.kills : 0) + '</b>kills</div><div><b>' + fmt(best) + '</b>best</div>';
    playBtn.textContent = 'Play again';
    teamLbl.innerHTML = '&nbsp;'; chips.forEach(c => c.classList.remove('on'));
    menu.classList.remove('gone');
    $('hud').classList.add('hud-off');
  }, 900);
}
playBtn.addEventListener('click', startFlow);

/* ---------- boot ---------- */
updateHud();

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
